# This file contains the configuration for this project.
version: '3'

info:
  companyName: "ScheduleGate"
  productName: "ScheduleGate"
  productIdentifier: "com.schedulegate.gui"
  description: "DCMA 14-Point Schedule Assessment Tool"
  copyright: "(c) 2026 ScheduleGate"
  comments: "DCMA 14-Point Schedule Assessment Desktop Application"
  version: "1.0.5"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# iOS/Android (uncomment to customize)
# ios:
#   bundleID: "com.schedulegate.gui"
#   displayName: "ScheduleGate"
#   version: "1.0.2"
#   company: "ScheduleGate"

fileAssociations: []
